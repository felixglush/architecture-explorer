name: Distribution
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: skills/architecture-explorer/renderer/package-lock.json
      - run: npm ci --prefix skills/architecture-explorer/renderer
      - run: npm test
      - run: npm run check
      - run: npm --prefix skills/architecture-explorer/renderer run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: skills/architecture-explorer/renderer
      - run: npm run test:browser
      - run: npm run pack:release
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-explorer
          path: |
            architecture-explorer-*.tgz
            skills/architecture-explorer/renderer/dist/index.html
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: architecture-explorer
          path: release
      - run: gh release create "$GITHUB_REF_NAME" release/*.tgz release/skills/architecture-explorer/renderer/dist/index.html --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
