name: Distribution
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: skills/architecture-explorer/renderer/package-lock.json
      - run: npm ci --prefix skills/architecture-explorer/renderer
      - run: npm test
      - run: npm run check
      - run: npm --prefix skills/architecture-explorer/renderer run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: skills/architecture-explorer/renderer
      - run: npm run test:browser
      - run: npm run pack:release
      - uses: actions/upload-artifact@v4
        with:
          name: webhook-example
          path: skills/architecture-explorer/renderer/dist/webhook.html
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-explorer
          path: |
            architecture-explorer-*.tgz
            skills/architecture-explorer/renderer/dist/*.html
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: architecture-explorer
          path: release
      - run: gh release create "$GITHUB_REF_NAME" release/*.tgz release/skills/architecture-explorer/renderer/dist/*.html --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: architecture-explorer
          path: site-artifact
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-artifact/skills/architecture-explorer/renderer/dist
      - name: Deploy example canvas
        id: deployment
        uses: actions/deploy-pages@v4
